<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2d4a6b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="곤충 로봇" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <title>곤충 로봇 배틀</title>
  <style>
    :root {
      --ink: #26304a; --sub: #6a7190; --p1: #4da3ff; --p2: #ff5d73; --gold: #ffd36b;
      --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
      --safeL: env(safe-area-inset-left, 0px); --safeR: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #2d4a6b; color: var(--ink);
      font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    [hidden] { display: none !important; }
    button, a.small { font-family: inherit; border: 0; cursor: pointer; color: inherit; text-decoration: none; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column; overflow-y: auto;
      padding: calc(10px + var(--safeT)) calc(14px + var(--safeR)) calc(12px + var(--safeB)) calc(14px + var(--safeL));
      touch-action: pan-y;
    }
    .bgbot { background: radial-gradient(circle at 30% 20%, #4f7fb0, #2d4a6b 60%, #1d3049); }
    .dim { background: rgba(15, 25, 40, 0.55); }
    .big {
      display: block; width: 100%; padding: 14px 16px; margin: 8px 0; border-radius: 22px; font-size: 22px;
      background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.25); transition: transform .08s;
    }
    .big:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
    .big:disabled { opacity: .5; }
    .big.adv { background: linear-gradient(135deg, #8fe0ff, #3a8be8); color: #fff; }
    .big.pvp { background: linear-gradient(135deg, #ffb0bd, #ff5d73); color: #fff; }
    .big.gar { background: linear-gradient(135deg, #ffe07a, #ff9a3d); color: #fff; }
    .big.go { background: linear-gradient(135deg, #a6f08a, #3fb35a); color: #fff; }
    .small {
      display: inline-block; padding: 9px 14px; border-radius: 16px; background: rgba(255,255,255,0.92);
      font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }
    .small:active { transform: translateY(2px); }
    .coins { background: rgba(0,0,0,0.38); color: #fff; padding: 7px 14px; border-radius: 99px; font-size: 17px; white-space: nowrap; }
    .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .bar h2 { flex: 1; margin: 0; font-size: 24px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.3); font-weight: normal; white-space: nowrap; }

    /* 타이틀 */
    #title { align-items: center; justify-content: center; text-align: center; }
    #title .logo { font-size: 46px; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.35); margin: 0; line-height: 1.1; }
    #title .logo small { display: block; font-size: 18px; color: #cfe6ff; margin-top: 6px; text-shadow: none; }
    #title .menu { width: min(380px, 100%); margin-top: 10px; }
    #title .top { position: absolute; top: calc(10px + var(--safeT)); left: calc(14px + var(--safeL)); right: calc(14px + var(--safeR)); display: flex; justify-content: space-between; align-items: center; }
    #titleBot { width: 220px; height: 130px; }

    /* 차고 */
    .garage { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .gl { width: 40%; min-width: 230px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; touch-action: pan-y; }
    .gr { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 10px 12px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
    #prev { width: 100%; height: 190px; display: block; border-radius: 16px; background: radial-gradient(circle, #e8f3ff, #b8d3ee); }
    .stat { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 3px 0; }
    .stat b { width: 40px; font-weight: normal; color: var(--sub); }
    .stat i { flex: 1; height: 10px; background: #e3e8f2; border-radius: 9px; overflow: hidden; }
    .stat i span { display: block; height: 100%; background: linear-gradient(90deg, #6cc4ff, #3a8be8); border-radius: 9px; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .slots div { background: #eef3fb; border-radius: 12px; padding: 5px 8px; font-size: 14px; }
    .slots div small { color: var(--sub); display: block; font-size: 12px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; flex-shrink: 0; }
    .tabs button { padding: 9px 13px; border-radius: 14px; background: rgba(255,255,255,.55); font-size: 17px; white-space: nowrap; }
    .tabs button.on { background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; overflow-y: auto; padding-bottom: 10px; touch-action: pan-y; }
    .it { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 8px; text-align: center; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.18); font-size: 16px; }
    .it.on { outline: 4px solid #3fb35a; }
    .it.lock { background: rgba(225,230,240,0.95); }
    .it canvas { width: 100%; height: 80px; display: block; }
    .it .em { font-size: 34px; line-height: 1.2; }
    .it small { display: block; color: var(--sub); font-size: 12px; line-height: 1.25; min-height: 30px; }
    .it .price { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 99px; background: #ffd36b; font-size: 14px; }
    .it .tag { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 99px; background: #d7f5d0; font-size: 14px; color: #2c7a35; }
    .pal { display: flex; flex-wrap: wrap; gap: 10px; }
    .pal button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); font-size: 13px; }
    .pal button.on { outline: 4px solid #3fb35a; }
    .who { display: flex; gap: 6px; }
    .who button { padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.5); font-size: 16px; }
    .who button.on { background: #fff; }

    /* 리그 */
    .worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    .world { border-radius: 20px; padding: 10px; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
    .world h3 { margin: 0 0 6px; font-weight: normal; font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .st { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; margin: 5px 0; border-radius: 14px; background: rgba(255,255,255,.93); color: var(--ink); font-size: 16px; text-align: left; }
    .st:disabled { opacity: .45; }
    .st .n { width: 28px; height: 28px; border-radius: 50%; background: #3a8be8; color: #fff; display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
    .st.boss .n { background: #ff5d73; }
    .st .s { margin-left: auto; }

    /* 대전 준비 */
    .vs { display: flex; gap: 12px; align-items: stretch; justify-content: center; flex-wrap: wrap; }
    .vs .card { flex: 1; min-width: 220px; max-width: 360px; text-align: center; }
    .vs canvas { width: 100%; height: 140px; display: block; }
    .vs h3 { margin: 0; font-weight: normal; font-size: 22px; }

    /* 결과/멈춤 */
    .pop { margin: auto; width: min(420px, 100%); background: #fff; border-radius: 26px; padding: 18px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
    .pop h2 { margin: 0 0 6px; font-weight: normal; font-size: 32px; }
    .pop p { margin: 6px 0; font-size: 18px; color: var(--sub); }
    .pop .gift { background: #fff6d6; border-radius: 16px; padding: 8px; margin: 8px 0; font-size: 18px; color: var(--ink); }

    /* 터치 조작 */
    #touch { position: fixed; inset: 0; pointer-events: none; }
    .jz { position: absolute; pointer-events: auto; touch-action: none; }
    .joy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.18); border: 3px solid rgba(255,255,255,.45); pointer-events: none; }
    .joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
    .tb { position: absolute; width: 78px; height: 78px; border-radius: 50%; pointer-events: auto; touch-action: none; font-size: 32px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.25); color: #fff; }
    .tb.atk { background: rgba(255, 110, 90, .85); }
    .tb.sk { background: rgba(110, 120, 255, .85); width: 66px; height: 66px; font-size: 26px; }
    .tb.down { transform: scale(.92); }
    .tb .cdm { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
    #pauseBtn { position: fixed; top: calc(8px + var(--safeT)); left: 50%; transform: translateX(-50%); margin-top: 34px; padding: 6px 12px; font-size: 18px; border-radius: 14px; background: rgba(255,255,255,.7); }
    #keys { position: fixed; bottom: calc(6px + var(--safeB)); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.85); font-size: 14px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

    @media (max-width: 640px) and (orientation: portrait) {
      .garage { flex-direction: column; }
      .gl { width: 100%; }
    }
    @media (max-height: 430px) {
      #prev { height: 130px; }
      #title .logo { font-size: 34px; }
      .big { padding: 10px 14px; font-size: 19px; margin: 6px 0; }
      #titleBot { height: 90px; }
    }
  </style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 타이틀 -->
<div id="title" class="screen bgbot">
  <div class="top">
    <a class="small" href="../">🏠 게임파크</a>
    <span class="coins">🪙 <span class="cn">0</span></span>
  </div>
  <canvas id="titleBot"></canvas>
  <h1 class="logo">곤충 로봇 배틀<small>곤충에 로봇 아이템을 붙여서 싸워요!</small></h1>
  <div class="menu">
    <button class="big adv" data-go="league">🏆 리그 모험</button>
    <button class="big gar" data-go="garage">🔧 로봇 조립 (아이템 붙이기)</button>
    <button class="big pvp" data-go="pvp">👫 둘이서 대전</button>
    <button class="small" id="sndBtn">🔊 소리 켜짐</button>
  </div>
</div>

<!-- 차고 -->
<div id="garage" class="screen bgbot" hidden>
  <div class="bar">
    <button class="small" data-back>◀ 뒤로</button>
    <h2>🔧 로봇 조립</h2>
    <div class="who" id="who"><button data-who="p1" class="on">1P 로봇</button><button data-who="p2">2P 로봇</button></div>
    <span class="coins">🪙 <span class="cn">0</span></span>
  </div>
  <div class="garage">
    <div class="gl">
      <div class="card">
        <canvas id="prev"></canvas>
        <div style="text-align:center;font-size:20px;margin-top:4px" id="gName"></div>
        <div style="text-align:center;font-size:14px;color:var(--sub)" id="gAtk"></div>
      </div>
      <div class="card" id="gStats"></div>
      <div class="card slots" id="gSlots"></div>
    </div>
    <div class="gr">
      <div class="tabs" id="tabs">
        <button data-tab="insect" class="on">🐞 곤충</button>
        <button data-tab="head">📡 머리</button>
        <button data-tab="back">🚀 등</button>
        <button data-tab="legs">🛞 다리</button>
        <button data-tab="arm">🔩 무기</button>
        <button data-tab="paint">🎨 색칠</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<!-- 리그 -->
<div id="league" class="screen bgbot" hidden>
  <div class="bar">
    <button class="small" data-back>◀ 뒤로</button>
    <h2>🏆 리그 모험</h2>
    <button class="small" data-go="garage">🔧 조립</button>
    <span class="coins">🪙 <span class="cn">0</span></span>
  </div>
  <div class="worlds" id="worlds"></div>
</div>

<!-- 2인 대전 준비 -->
<div id="pvp" class="screen bgbot" hidden>
  <div class="bar">
    <button class="small" data-back>◀ 뒤로</button>
    <h2>👫 둘이서 대전</h2>
  </div>
  <div class="vs">
    <div class="card"><h3 style="color:var(--p1)">1P</h3><canvas id="vs1"></canvas><div id="vs1n"></div><button class="small" data-edit="p1" style="margin-top:6px">🔧 1P 조립</button></div>
    <div class="card"><h3 style="color:var(--p2)">2P</h3><canvas id="vs2"></canvas><div id="vs2n"></div><button class="small" data-edit="p2" style="margin-top:6px">🔧 2P 조립</button></div>
  </div>
  <div style="width:min(420px,100%);margin:10px auto 0">
    <button class="big go" id="pvpGo">⚔️ 대전 시작!</button>
    <p style="color:#dfeeff;text-align:center;margin:4px 0;font-size:15px">키보드: 1P W A S D 이동 · F 공격 · G 기술 / 2P 방향키 이동 · K 공격 · L 기술</p>
  </div>
</div>

<!-- 결과 -->
<div id="result" class="screen dim" hidden>
  <div class="pop">
    <h2 id="rTitle"></h2>
    <p id="rText"></p>
    <div id="rGift"></div>
    <button class="big go" id="rNext">다음 ▶</button>
    <button class="big" id="rAgain">🔁 다시 하기</button>
    <button class="big" id="rMenu">🏠 처음으로</button>
  </div>
</div>

<!-- 멈춤 -->
<div id="pause" class="screen dim" hidden>
  <div class="pop">
    <h2>⏸ 잠깐 멈춤</h2>
    <button class="big go" id="pResume">▶ 계속하기</button>
    <button class="big" id="pQuit">🏠 그만하기</button>
  </div>
</div>

<div id="touch" hidden></div>
<button id="pauseBtn" hidden>⏸</button>
<div id="keys" hidden></div>

<script>
(function () {
  'use strict';

  // 오래된 브라우저(예전 아이패드/크롬)에는 roundRect가 없어서 직접 만들어 줘요
  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.max(0, Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w) / 2, Math.abs(h) / 2));
      this.moveTo(x + r, y); this.lineTo(x + w - r, y); this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r); this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h); this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r); this.quadraticCurveTo(x, y, x + r, y); this.closePath();
      return this;
    };
  }

  /* ================= 데이터 ================= */
  var W = 960, H = 560, WALL = 34;

  // 곤충(로봇 몸체). atk: 기본 공격, skill: 쿨타임 기술
  var INSECTS = {
    stag: { name: '사슴벌레', color: '#c0563a', hp: 110, speed: 225, mass: 1.2, price: 0, desc: '큰 집게로 꽉 집어요',
      atk: { type: 'melee', name: '집게 집기', dmg: 11, range: 30, arc: 1.7, kb: 380, cd: 0.5 },
      skill: { id: 'grab', name: '꽉 집어 던지기', icon: '🦾', cd: 6 } },
    rhino: { name: '장수풍뎅이', color: '#8a5a32', hp: 130, speed: 205, mass: 1.5, price: 0, desc: '긴 뿔로 들이받아요',
      atk: { type: 'melee', name: '뿔 치기', dmg: 9, range: 30, arc: 1.3, kb: 560, cd: 0.55 },
      skill: { id: 'charge', name: '뿔 돌진', icon: '💨', cd: 5.5 } },
    ant: { name: '개미', color: '#d23c3c', hp: 95, speed: 245, mass: 0.9, price: 0, desc: '친구 개미를 불러요',
      atk: { type: 'melee', name: '와앙 물기', dmg: 8, range: 22, arc: 1.5, kb: 230, cd: 0.38 },
      skill: { id: 'friends', name: '개미 친구 부르기', icon: '🐜', cd: 9 } },
    ladybug: { name: '무당벌레', color: '#e8352f', hp: 145, speed: 200, mass: 1.4, price: 150, desc: '단단한 등껍질 방패',
      atk: { type: 'melee', name: '몸통 박치기', dmg: 8, range: 20, arc: 1.9, kb: 330, cd: 0.45 },
      skill: { id: 'shell', name: '등껍질 방패', icon: '🛡️', cd: 8 } },
    bee: { name: '꿀벌', color: '#f2b318', hp: 85, speed: 255, mass: 0.8, price: 220, desc: '멀리서 벌침을 쏴요',
      atk: { type: 'shot', name: '벌침 발사', dmg: 6, spd: 640, life: 0.9, cd: 0.42, col: '#ffe04a' },
      skill: { id: 'swarm', name: '벌침 소나기', icon: '🐝', cd: 6 } },
    firefly: { name: '반딧불이', color: '#3d9c5a', hp: 90, speed: 240, mass: 0.85, price: 260, desc: '번쩍! 상대를 멈춰요',
      atk: { type: 'shot', name: '빛 구슬', dmg: 7, spd: 520, life: 1.0, cd: 0.5, col: '#c8ff6a' },
      skill: { id: 'flash', name: '번쩍 섬광', icon: '💡', cd: 7.5 } },
    mantis: { name: '사마귀', color: '#5fbf3f', hp: 100, speed: 240, mass: 1.0, price: 320, desc: '빠른 낫 베기',
      atk: { type: 'melee', name: '낫 베기', dmg: 6, range: 36, arc: 1.6, kb: 170, cd: 0.24 },
      skill: { id: 'spin', name: '회전 낫 베기', icon: '🌪️', cd: 6 } },
    dragonfly: { name: '잠자리', color: '#2f8fd8', hp: 85, speed: 285, mass: 0.75, price: 380, desc: '가장 빠르고 순간이동',
      atk: { type: 'shot', name: '바람 칼날', dmg: 6, spd: 760, life: 0.35, cd: 0.32, col: '#cdeeff' },
      skill: { id: 'blink', name: '순간 이동', icon: '✨', cd: 5 } },
  };
  var INSECT_ORDER = ['stag', 'rhino', 'ant', 'ladybug', 'bee', 'firefly', 'mantis', 'dragonfly'];

  // 곤충에 붙이는 로봇 아이템 (부위마다 하나씩)
  var ITEMS = {
    radar:    { slot: 'head', name: '레이더 더듬이', emoji: '📡', price: 120, desc: '25% 확률로 두 배 피해' },
    helmet:   { slot: 'head', name: '강철 헬멧', emoji: '⛑️', price: 0, desc: '받는 피해 20% 줄어요' },
    lasereye: { slot: 'head', name: '레이저 눈', emoji: '👁️', price: 200, desc: '2.5초마다 레이저 자동 발사' },
    rocket:   { slot: 'back', name: '로켓 부스터', emoji: '🚀', price: 0, desc: '속도 20% 빨라져요' },

      } else {
        zone.style.cssText = 'right:0;top:35%;bottom:0;width:30%';
        atk.style.cssText = 'right:calc(14px + var(--safeR));top:calc(60px + var(--safeT))';
        sk.style.cssText = 'right:calc(100px + var(--safeR));top:calc(66px + var(--safeT))';
      }
      var cx = 0, cy = 0;
      zone.addEventListener('pointerdown', function (e) {
        if (ts.id !== null) return; ts.id = e.pointerId; zone.setPointerCapture(e.pointerId);
        cx = e.clientX; cy = e.clientY; joy.style.left = cx + 'px'; joy.style.top = cy + 'px'; joy.hidden = false;
        joy.firstChild.style.transform = ''; e.preventDefault();
      });
      zone.addEventListener('pointermove', function (e) {
        if (e.pointerId !== ts.id) return;
        var dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy), max = 50;
        if (d > max) { dx = dx / d * max; dy = dy / d * max; }
        ts.jx = dx / max; ts.jy = dy / max;
        if (Math.hypot(ts.jx, ts.jy) < 0.15) { ts.jx = ts.jy = 0; }
        joy.firstChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      });
      function end(e) { if (e.pointerId !== ts.id) return; ts.id = null; ts.jx = ts.jy = 0; joy.hidden = true; }
      zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
      atk.addEventListener('pointerdown', function (e) { e.preventDefault(); ts.atk = true; atk.classList.add('down'); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { atk.addEventListener(ev, function () { ts.atk = false; atk.classList.remove('down'); }); });
      sk.addEventListener('pointerdown', function (e) { e.preventDefault(); if (G) G.fighters[i].in.sk = true; sk.classList.add('down'); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { sk.addEventListener(ev, function () { sk.classList.remove('down'); }); });
      ts.skEl = sk;
      box.appendChild(zone); box.appendChild(joy); box.appendChild(atk); box.appendChild(sk);
    })(i);
  }
  function cleanupTouch() { $('touch').hidden = true; $('touch').innerHTML = ''; touchState = [null, null]; $('pauseBtn').hidden = true; $('keys').hidden = true; $('pause').hidden = true; }

  /* ================= 그리기 ================= */
  var dpr = 1, cw = 0, ch = 0;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = window.innerWidth; ch = window.innerHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  window.addEventListener('resize', resize); resize();

  function botView(f) {
    var att = [];
    if (f.attach) for (var k in f.attach) if (f.attach[k] > 0) att.push(k);
    return { insect: f.insect, items: f.items, color: f.color, ang: f.ang, walk: f.walk, moving: f.moving, sc: f.sc, time: G.t, swing: Math.max(0, f.swing), flash: f.flash, attach: att, laserGlow: f.laserGlow, charge: f.charge, spin: f.spin, grab: f.grab, misReady: f.misReady };
  }

  function render() {
    var c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!G) { c.clearRect(0, 0, cw, ch); return; }
    c.fillStyle = '#1d2a3a'; c.fillRect(0, 0, cw, ch);
    var topPad = 52, s = Math.min(cw / W, (ch - topPad) / H), ox = (cw - W * s) / 2, oy = topPad + (ch - topPad - H * s) / 2;
    var sh = G.shake;
    c.save();
    c.translate(ox + rnd(-sh, sh) * s, oy + rnd(-sh, sh) * s); c.scale(s, s);
    c.drawImage(G.bg, 0, 0, W, H);
    // 줍는 아이템
    G.picks.forEach(function (p) {
      var bob = Math.sin(p.t * 4) * 3, blink = p.life < 3 && Math.sin(p.t * 20) > 0;
      if (blink) return;
      c.beginPath(); c.arc(p.x, p.y + 6, 13, 0, 6.3); c.fillStyle = 'rgba(0,0,0,0.2)'; c.fill();
      c.beginPath(); c.arc(p.x, p.y + bob, 17, 0, 6.3); c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#ffcc33'; c.stroke();
      c.font = '20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(PICKS[p.type].emoji, p.x, p.y + bob + 1);
    });
    // 미니 개미
    G.minions.forEach(function (m) {
      c.save(); c.translate(m.x, m.y);
      drawBot(c, { insect: 'ant', items: {}, color: m.color, ang: m.ang, walk: m.walk, moving: true, sc: 0.42, time: G.t, swing: Math.max(0, m.swing || 0), flash: m.flash });
      c.restore();
    });
    // 로봇
    G.fighters.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (f) {
      if (f.dead) { c.globalAlpha = 0.35; }
      c.save(); c.translate(f.x, f.y);
      if (f.inv > 0 && f.shellT > 0) { c.beginPath(); c.arc(0, 0, f.r + 12, 0, 6.3); c.fillStyle = 'rgba(255,230,120,0.25)'; c.fill(); c.lineWidth = 3; c.strokeStyle = 'rgba(255,220,90,0.9)'; c.stroke(); }
      if (f.attach.shield > 0) { c.beginPath(); c.arc(0, 0, f.r + 9, 0, 6.3); c.lineWidth = 2.5; c.strokeStyle = 'rgba(160,210,255,' + (0.5 + 0.3 * Math.sin(G.t * 6)) + ')'; c.stroke(); }
      if (f.spin > 0) { c.beginPath(); c.arc(0, 0, f.r + 40 * f.sc, 0, 6.3); c.fillStyle = 'rgba(200,255,200,0.18)'; c.fill(); }
      // 편 표시 링
      c.beginPath(); c.ellipse(0, 4, f.r + 6, (f.r + 6) * 0.8, 0, 0, 6.3); c.lineWidth = 3; c.strokeStyle = f.side === 0 ? 'rgba(77,163,255,0.8)' : 'rgba(255,93,115,0.8)'; c.stroke();
      drawBot(c, botView(f));
      if (f.stun > 0 && !f.dead) {
        c.font = '16px sans-serif'; c.textAlign = 'center';
        for (var k = 0; k < 3; k++) { var a = G.t * 5 + k * 2.1; c.fillText('⭐', Math.cos(a) * 18, -f.r - 12 + Math.sin(a) * 5); }
      }
      c.restore();
      c.globalAlpha = 1;
      // 이름표
      if (!f.dead) {
        c.font = '15px Jua, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
        c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.5)'; c.strokeText(f.name, f.x, f.y - f.r - 14);
        c.fillStyle = f.side === 0 ? '#bfe0ff' : '#ffd0d8'; c.fillText(f.name, f.x, f.y - f.r - 14);
      }
    });
    // 발사체
    G.projs.forEach(function (p) {
      if (p.kind === 'missile') {
        c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(p.vy, p.vx));
        c.fillStyle = '#e04848'; c.beginPath(); c.roundRect(-8, -3, 14, 6, 3); c.fill(); c.fillStyle = '#ffd23a'; c.beginPath(); c.moveTo(-8, -2); c.lineTo(-14, 0); c.lineTo(-8, 2); c.fill();
        c.restore();
      } else if (p.kind === 'wind') {
        c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(p.vy, p.vx));
        c.beginPath(); c.arc(-6, 0, 10, -1.2, 1.2); c.lineWidth = 4; c.strokeStyle = 'rgba(220,245,255,0.9)'; c.stroke();
        c.restore();
      } else {
        c.beginPath(); c.arc(p.x, p.y, p.r * 1.8, 0, 6.3); c.fillStyle = p.col + '55'; c.fill();
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.3); c.fillStyle = p.col; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(0,0,0,0.4)'; c.stroke();
      }
    });
    G.beams.forEach(function (b) {
      if (b.kind === 'laser') {
        c.beginPath(); c.moveTo(b.x1, b.y1); c.lineTo(b.x2, b.y2); c.lineWidth = 7; c.strokeStyle = 'rgba(255,60,60,0.35)'; c.stroke();
        c.lineWidth = 2.5; c.strokeStyle = '#ffb0b0'; c.stroke();
      } else if (b.kind === 'flash') {
        var k = 1 - b.t / 0.4;
        c.beginPath(); c.arc(b.x, b.y, 30 + k * 150, 0, 6.3); c.fillStyle = 'rgba(255,255,200,' + (0.6 * (1 - k)) + ')'; c.fill();
      }
    });
    G.parts.forEach(function (p) { c.globalAlpha = clamp(p.t / p.max, 0, 1); c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.3); c.fillStyle = p.col; c.fill(); });
    c.globalAlpha = 1;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    G.texts.forEach(function (t) {
      c.globalAlpha = clamp(t.t / 0.3, 0, 1); c.font = t.size + 'px Jua, sans-serif';
      c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,0.55)'; c.strokeText(t.s, t.x, t.y); c.fillStyle = t.col; c.fillText(t.s, t.x, t.y);
    });
    c.globalAlpha = 1;
    if (G.world.name === '밤의 숲') { c.fillStyle = 'rgba(10,20,50,0.18)'; c.fillRect(0, 0, W, H); }
    c.restore();
    drawHud(c);
  }

  function hpBar(c, x, y, w, f, right) {
    var h = 16, r = clamp(f.hp / f.maxHp, 0, 1);
    c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.roundRect(x - 2, y - 2, w + 4, h + 4, 10); c.fill();
    c.fillStyle = r > 0.5 ? '#5fd46a' : r > 0.25 ? '#ffc93d' : '#ff5d5d';
    var bw = w * r; c.beginPath(); c.roundRect(right ? x + w - bw : x, y, Math.max(0.1, bw), h, 8); c.fill();
    if (f.attach && f.attach.shield > 0 && f.shieldHp > 0) { c.fillStyle = 'rgba(160,210,255,0.85)'; var sw = w * f.shieldHp / f.maxHp; c.fillRect(right ? x + w - bw - sw : x + bw, y + 3, sw, h - 6); }
    // 기술 게이지
    var k = clamp(1 - f.skT / f.skMax, 0, 1);
    c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.roundRect(x, y + h + 4, w * 0.6 + 2, 7, 4); c.fill();
    c.fillStyle = k >= 1 ? '#a8b6ff' : '#6672c8'; c.beginPath(); c.roundRect(right ? x + w * 0.4 * 0 : x, y + h + 5, Math.max(0.1, w * 0.6 * k), 5, 3); c.fill();
    c.font = '15px Jua, sans-serif'; c.textBaseline = 'top'; c.textAlign = right ? 'right' : 'left';
    c.fillStyle = '#fff'; c.fillText(f.name + ' · ' + INSECTS[f.insect].name + (k >= 1 ? '  ' + f.ins.skill.icon + ' 기술 준비!' : ''), right ? x + w : x, y + h + 13);
  }

  function drawHud(c) {
    var w = Math.min(320, cw * 0.36), top = 8 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safeT')) || 0);
    hpBar(c, 12, top, w, G.fighters[0], false);
    hpBar(c, cw - 12 - w, top, w, G.fighters[1], true);
    c.textAlign = 'center'; c.textBaseline = 'top'; c.font = '28px Jua, sans-serif';
    c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,0.5)';
    var tt = String(Math.ceil(G.time)); c.strokeText(tt, cw / 2, top - 2); c.fillStyle = G.time < 10 ? '#ff8a8a' : '#fff'; c.fillText(tt, cw / 2, top - 2);
    // 터치 기술 버튼 쿨타임
    touchState.forEach(function (ts, i) {
      if (!ts || !ts.skEl) return; var f = G.fighters[i], k = clamp(1 - f.skT / f.skMax, 0, 1);
      ts.skEl.lastChild.style.background = k >= 1 ? 'none' : 'conic-gradient(transparent ' + (k * 360) + 'deg, rgba(0,0,0,0.5) 0)';
    });
    c.textBaseline = 'middle';
    if (G.phase === 'count') {
      var n = Math.ceil(G.count - 0.4), txt = n >= 1 ? String(n) : '시작!';
      bigText(c, txt, n >= 1 ? '#fff' : '#ffd23a', 90);
      if (G.mode === 'league') { c.font = '24px Jua, sans-serif'; c.fillStyle = '#fff'; c.fillText(G.world.emoji + ' ' + G.world.name + ' · 스테이지 ' + (G.stage + 1), cw / 2, ch / 2 + 70); }
    } else if (G.phase === 'ko') {
      bigText(c, G.timeUp ? '시간 끝!' : 'K.O.!', '#ffd23a', 96);
    }
  }
  function bigText(c, s, col, size) {
    c.font = size + 'px Jua, sans-serif'; c.textAlign = 'center';
    c.lineWidth = 10; c.strokeStyle = 'rgba(0,0,0,0.55)'; c.strokeText(s, cw / 2, ch / 2);
    c.fillStyle = col; c.fillText(s, cw / 2, ch / 2);
  }

  function drawTitleBot(t) {
    var el = $('titleBot'); if (!el.clientWidth) return;
    var w = el.clientWidth, h = el.clientHeight;
    if (el.width !== Math.round(w * dpr)) { el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }
    var c = el.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    var k = h / 130;
    c.save(); c.translate(w * 0.28, h * 0.55); drawBot(c, { insect: S.builds.p1.insect, items: S.builds.p1.items, color: S.builds.p1.color, ang: Math.sin(t) * 0.15, walk: t * 8, moving: true, sc: 1.25 * k, time: t }); c.restore();
    c.save(); c.translate(w * 0.72, h * 0.5); drawBot(c, { insect: 'rhino', items: { back: 'rocket', head: 'radar' }, color: '#2f8fd8', ang: Math.PI + Math.sin(t * 1.1) * 0.15, walk: t * 8, moving: true, sc: 1.25 * k, time: t }); c.restore();
  }

  /* ================= 메인 루프 ================= */
  var last = performance.now(), clock = 0;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now; clock += dt;
    requestAnimationFrame(frame); // 한 번 오류가 나도 게임이 멈추지 않게 먼저 예약
    try {
      if (G && !paused) update(dt * (G && G.phase === 'ko' ? 0.5 : 1));
      render();
      if (current === 'garage') drawPreview(clock, dt);
      if (current === 'title') drawTitleBot(clock);
    } catch (e) { if (window.console) console.error(e); }
  }
  requestAnimationFrame(frame);

  window.addEventListener('visibilitychange', function () { if (document.hidden && G) setPause(true); });
  if (document.fonts && document.fonts.load) document.fonts.load('20px Jua').catch(function () {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  // 테스트용
  window.__bugbot = { S: S, start: startMatch, drawBot: drawBot, get G() { return G; } };
  show('title', true);
})();
</script>
